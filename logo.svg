      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0714" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b2cbf"/>
      <stop offset="50%" stop-color="#3c096c"/>
      <stop offset="100%" stop-color="#10002b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe3a8"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0d0714"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>
  <!-- Shield Outline -->
  <path d="M256,60 L380,120 C380,260 330,360 256,440 C182,360 132,260 132,120 Z" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>
  <!-- Inner Details -->
  <path d="M256,80 L360,130 C360,250 315,340 256,410 C197,340 152,250 152,130 Z" fill="none" stroke="#e0aaff" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Sword -->
  <path d="M256,90 L270,110 L262,110 L262,310 L275,310 L275,325 L262,325 L262,360 L250,360 L250,325 L237,325 L237,310 L250,310 L250,110 L242,110 Z" fill="url(#goldGrad)" stroke="#0d0714" stroke-width="2"/>
  <!-- Runes / Accents -->
  <circle cx="256" cy="256" r="80" fill="none" stroke="#ffb703" stroke-width="4" stroke-dasharray="10 5"/>
  <path d="M256,176 L256,336" stroke="#9d4edd" stroke-width="4" stroke-opacity="0.7"/>
  <path d="M176,256 L336,256" stroke="#9d4edd" stroke-width="4" stroke-opacity="0.7"/>
